fullnameOverride: sealed-secrets-controller

secretName: "sealed-secrets-key"
keycutofftime: "2030-01-01"
keyrenewperiod: "0"
commandArgs:
  - "--key-renew-period=0"
  - "--controller-namespace=sealed-secrets"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 256Mi
metrics:
  serviceMonitor:
    enabled: false
containerSecurityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
