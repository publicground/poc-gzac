fullnameOverride: sealed-secrets-controller

keyrenewperiod: "720h"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 256Mi
metrics:
  serviceMonitor:
    enabled: false
containerSecurityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
