# The name is overridden, as Kubeseal expects this name by default.
fullnameOverride: sealed-secrets-controller

commandArgs:
  - "--key-renew-period=0"
  - "--controller-namespace=sealed-secrets"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 150m
    memory: 256Mi
metrics:
  serviceMonitor:
    enabled: false
containerSecurityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
