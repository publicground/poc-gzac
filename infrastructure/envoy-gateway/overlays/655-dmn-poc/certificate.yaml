apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-cert
  namespace: envoy-gateway-system
spec:
  secretName: wildcard-tls
  dnsNames:
    - dmn-poc.publicground.nl
    - "*.dmn-poc.publicground.nl"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
  renewBefore: 720h
