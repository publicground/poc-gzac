envoyGateway:
  installCRDs: false

provider:
  type: Kubernetes

logging:
  level:
    default: info

deployment:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

config:
  envoyProxy:
    namespace: envoy-gateway-system
    name: default-envoy-proxy
