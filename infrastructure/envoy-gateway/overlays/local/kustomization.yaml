apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway-system

helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.8.0
    releaseName: eg
    namespace: envoy-gateway-system
    valuesFile: values.local.yaml
    includeCRDs: false

resources:
  - ns.yaml
  - gateway-local.yaml
  - gatewayclass-local.yaml
  - tls-secret.yaml