apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: publicground-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: file:///mnt/poc-gzac.git
    path: appsets/local/
    targetRevision: local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: "5s"
        factor: 2
        maxDuration: "3m0s"
