configs:
  cm:
    exec.enabled: true

    admin.enabled: false

    users.anonymous.enabled: "true"
    kustomize.buildOptions: "--enable-helm --load-restrictor LoadRestrictionsNone"

  params:
    server.insecure: "true"

  rbac:
    policy.csv: |
      g, users.anonymous, role:admin
    policy.default: role:admin

repoServer:
  volumes:
    - name: local-repo
      hostPath:
        path: /mnt/poc-gzac.git
        type: Directory
  volumeMounts:
    - name: local-repo
      mountPath: /mnt/poc-gzac.git

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd
      namespace: argocd
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: gateway-local
          namespace: envoy-gateway-system
          sectionName: http
      hostnames:
        - argocd.wigo4it.nl
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - group: ""
              kind: Service
              name: argocd-server
              port: 80
              weight: 1
