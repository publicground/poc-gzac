image:
  # docker pull --platform linux/amd64 ghcr.io/generiekzaakafhandelcomponent/suwinet-simulator:1.3.0-202604011155.main.a9fe526f
  # docker tag ghcr.io/generiekzaakafhandelcomponent/suwinet-simulator:1.3.0-202604011155.main.a9fe526f suwinet-simulator:local
  # kind load docker-image suwinet-simulator:local --name gitops-argocd
  # registry: "ghcr.io"
  # repository: "generiekzaakafhandelcomponent/suwinet-simulator"
  registry: "suwinet-simulator"
  # repository: "suwinet-simulator"
  tag: "local"
  # tag: "1.3.0-202604011155.main.a9fe526f"
  pullPolicy: IfNotPresent

appKind: Deployment

name: "suwinet-simulator"

automountServiceAccountToken: false

podSecurityContext:
  enabled: true
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true

containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

resources:
  limits:
    cpu: 1
    memory: 1024Mi
  requests:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: true
  tcpSocket:
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 2
  successThreshold: 1
readinessProbe:
  enabled: false
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1
startupProbe:
  enabled: true
  tcpSocket:
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 20
  successThreshold: 1

volumes:
  - name: tmpfs-1
    emptyDir: {}

volumeMounts:
  - mountPath: /tmp
    name: tmpfs-1

env:
  - name: SERVER_PORT
    value: "8080"
  - name: SUWINET_USER
    value: wigoadmin

envFrom:
  - secretRef:
      name: '{{ include "app.fullname" . }}'
