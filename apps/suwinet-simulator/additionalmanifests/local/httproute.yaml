apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gzac-backend
  namespace: publicground
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-local
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "gzac.wigo4it.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - group: ""
          kind: Service
          name: suwinet-simulator
          port: 8080
          weight: 1
