image:
  repository: maykinmedia/open-vtb

replicaCount: 1

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openvtb-pg-cluster-app"
        key: "password"
  - name: KEYCLOAK_DISCOVERY_URL
    value: "http://keycloak.wigo4it.nl/realms/publicground/"

settings:
  allowedHosts: "openvtb.wigo4it.nl"

  disable2fa: true

  siteDomain: "openvtb.wigo4it.nl"

  isHttps: false
