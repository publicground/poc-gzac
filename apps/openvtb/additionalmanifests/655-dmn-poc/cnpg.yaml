apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openvtb-pg-cluster
  namespace: publicground
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  imageName: "acr655.azurecr.io/ghcr.io/cloudnative-pg/postgis:18-3.6-system-trixie"
  storage:
    size: "10Gi"
    storageClass: managed-csi-retain
  bootstrap:
    initdb:
      database: "openvtb"
      owner: "openvtb"
      postInitSQL:
        - "CREATE EXTENSION IF NOT EXISTS postgis;"
        - "CREATE EXTENSION IF NOT EXISTS postgis_topology;"
        - "ALTER ROLE openvtb WITH SUPERUSER;"
