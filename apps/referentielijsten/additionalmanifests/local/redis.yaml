apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: referentielijsten-redis
  namespace: publicground
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/component: cache
    app.kubernetes.io/managed-by: redis
    app.kubernetes.io/part-of: referentielijsten
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v8.6.2
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 128Mi
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "1Gi"
        storageClassName: standard
