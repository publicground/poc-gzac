apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - referentielijsten-config-sealed.yaml
  - referentielijsten-sealed.yaml

patches:
  - path: patches/cnpg.yaml
  - path: patches/redis.yaml
  - path: patches/httproute.yaml

helmCharts:
  - name: referentielijsten
    version: 0.2.0
    repo: https://maykinmedia.github.io/charts/
    releaseName: referentielijsten
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.local.yaml
