image:
  repository: maykinmedia/referentielijsten-api

replicaCount: 1

persistence:
  enabled: false

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "referentielijsten-pg-cluster-app"
        key: "password"
  - name: KEYCLOAK_DISCOVERY_URL
    value: "http://keycloak.wigo4it.nl/realms/publicground/"

settings:
  allowedHosts: "referentielijsten.wigo4it.nl"

  disable2fa: true

  isHttps: false

  siteDomain: "referentielijsten.wigo4it.nl"
