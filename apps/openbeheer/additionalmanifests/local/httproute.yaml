apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openobjecten
  namespace: publicground
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: gateway-local
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "openbeheer.wigo4it.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: openbeheer
          port: 80
          weight: 1
