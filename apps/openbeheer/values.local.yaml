global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  job:
    enabled: true
    ttlSecondsAfterFinished: ""
  data: |-
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: http://keycloak.wigo4it.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openbeheer
        oidc_rp_client_secret:
          value_from:
            env: KEYCLOAK_CLIENT_SECRET
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENBEHEER_ADMIN

tags:
  redis: false

replicaCount: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

persistence:
  enabled: false

existingSecret: openbeheer
existingConfigurationSecrets: openbeheer-config-secrets

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openbeheer-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "localhost, openbeheer, openbeheer.wigo4it.nl"

  disable2fa: true

  database:
    host: "openbeheer-pg-cluster-rw"
    port: 5432
    username: "openbeheer"
    name: "openbeheer"

  siteDomain: "openbeheer.wigo4it.nl"

  cache:
    default: "openbeheer-redis:6379/0"
    axes: "openbeheer-redis:6379/0"

  isHttps: false

redis:
  enabled: false
