apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - openbeheer-config-sealed.yaml
  - openbeheer-sealed.yaml

patches:
  - path: patches/cnpg.yaml
  - path: patches/redis.yaml
  - path: patches/httproute.yaml

helmCharts:
  - name: openbeheer
    version: 0.2.0
    repo: https://maykinmedia.github.io/charts/
    releaseName: openbeheer
    namespace: publicground
    valuesFile:  ../../base/values.yaml
    additionalValuesFiles:
      - values.local.yaml
