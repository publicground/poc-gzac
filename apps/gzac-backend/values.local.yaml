image:
  tag: sd-alo-backend-925abf46-1779802620

replicaCount: 1

# Liveness probe is disabled on test. This in order to facilitate remote debugging on this environment.
livenessProbe:
  enabled: false


## Autoscaling configuration
##
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  # targetCPU: 50
  # targetMemory: 50

## An array to add env vars
## For example:
## env:
##  - name: TEST_VAR
##    value: test
##
