  # - name: AWS_SSM_ENABLED
  #   value: "false"
  # - name: SPRING_PROFILES_ACTIVE
  #   value: postgres
  - name: SPRING_DATASOURCE_USERNAME
    valueFrom:
      secretKeyRef:
        name: gzac-backend-pg-cluster-app
        key: password
  - name: SPRING_DATASOURCE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: gzac-backend-pg-cluster-app
        key: password
  - name: SPRING_DATASOURCE_URL
    valueFrom:
      secretKeyRef:
        name: gzac-backend-pg-cluster-app
        key: jdbc-uri
  - name: KEYCLOAK_AUTH_SERVER_URL
    value: http://keycloak.wigo4it.nl
  - name: KEYCLOAK_REALM
    value: publicground
  - name: KEYCLOAK_RESOURCE
    value: gzac-backend
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAKAPI_CLIENT_ID
    value: gzac-backend
  - name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAKAPI_PROVIDER
    value: keycloakapi
  - name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAKAPI_ISSUER_URI
    value: "http://keycloak.wigo4it.nl/realms/publicground"
  - name: CAMUNDA_BPM_ADMINUSER_ID
    value: wigoadmin
  - name: VALTIMO_OAUTH_PUBLIC-KEY
    value: 
  - name: KEYCLOAK_HOST
    value: http://keycloak.wigo4it.nl
  - name: VALTIMO_RESOURCE_TEMP_DIRECTORY
    value: /data/tmp
  - name: LOGGING_LEVEL_ROOT
    value: INFO

