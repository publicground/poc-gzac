apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gzac-backend-pg-cluster
  namespace: publicground
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.3-system-trixie"
  storage:
    size: "1Gi"
    storageClass: managed-csi-retain
  bootstrap:
    initdb:
      database: "gzac-backend"
      owner: "gzac-backend"
