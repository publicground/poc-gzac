# Sealed with kubeseal against the aks-655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
# AUTODEPLOYMENT_PLUGINCONFIG_SUWINET_SIMULATOR_BASIC_SECRET: basic auth password for suwinet simulator
# KEYCLOAK_CREDENTIALS_SECRET: Keycloak client secret for gzac-backend
# CAMUNDA_BPM_ADMINUSER_PASSWORD: Camunda admin user password (replaces OPERATON_BPM_ADMINUSER_PASSWORD)
# SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAKAPI_CLIENTSECRET: OAuth2 client secret
# VALTIMO_CONNECTORENCRYPTION_SECRET: Valtimo connector encryption secret
# VALTIMO_OPEN_ZAAK_CLIENT_SECRET: shared secret between gzac-backend and openzaak
# AUTODEPLOYMENT_PLUGINCONFIG_OPENZAAK-AUTHENTICATION_CLIENTSECRET: OpenZaak authentication client secret
# VALTIMO_PLUGIN_ENCRYPTIONSECRET: Valtimo plugin encryption secret (16, 24 or 32 bytes)
#
# To seal CAMUNDA_BPM_ADMINUSER_PASSWORD:
#   echo -n "$VALUE" | kubeseal --raw --from-file=/dev/stdin \
#     --namespace publicground \
#     --name gzac-backend \
#     --context aks-655-dmn-poc \
#     --controller-namespace sealed-secrets \
#     --controller-name sealed-secrets
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gzac-backend
  namespace: publicground
spec:
  encryptedData:
    AUTODEPLOYMENT_PLUGINCONFIG_OPENZAAK-AUTHENTICATION_CLIENTSECRET: 
    AUTODEPLOYMENT_PLUGINCONFIG_SUWINET_SIMULATOR_BASIC_SECRET: 
    KEYCLOAK_CREDENTIALS_SECRET: 
    CAMUNDA_BPM_ADMINUSER_PASSWORD: 
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAKAPI_CLIENTSECRET: 
    VALTIMO_CONNECTORENCRYPTION_SECRET: 
    VALTIMO_OPEN_ZAAK_CLIENT_SECRET: 
    VALTIMO_PLUGIN_ENCRYPTIONSECRET: 
  template:
    metadata:
      name: gzac-backend
      namespace: publicground
    type: Opaque