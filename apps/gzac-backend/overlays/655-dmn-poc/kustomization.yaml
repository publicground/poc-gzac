apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - gzac-backend-sealed.yaml

patches:
  - path: patches/httproute.yaml

helmCharts:
  - name: generic
    version: 0.0.32
    repo: https://gemeente-denhaag.github.io/helm-charts
    releaseName: gzac-backend
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.655-dmn-poc.yaml
