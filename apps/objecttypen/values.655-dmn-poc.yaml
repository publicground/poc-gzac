global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — OBJECTS_SUPERUSER_PASSWORD must be
    # present as a key in the objecttypen SealedSecret (additionalmanifests/655-dmn-poc/sealedsecret-objecttypen.yaml)
  initContainer:
    enabled: false
  job:
    enabled: false

tags:
  redis: false

replicaCount: 1

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see additionalmanifests/655-dmn-poc/httproute.yaml

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

existingSecret: objecttypen

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "objecttypen-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "objecttypen.dmn-poc.publicground.nl"

  database:
    host: "objecttypen-pg-cluster-rw"
    port: 5432
    username: "objecttypen"
    name: "objecttypen"

  cache:
    default: "objecttypen-redis:6379/0"
    axes: "objecttypen-redis:6379/0"

  debug: false

  disable2fa: true

redis:
  enabled: false
