# Sealed with kubeseal against the 655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
# SECRET_KEY: random 50-char alphanumeric
# OBJECTS_SUPERUSER_PASSWORD: admin superuser password
#
# To generate:
#   echo -n '<value>' | kubectl create secret generic objecttypen \
#     --dry-run=client --from-file=SECRET_KEY=/dev/stdin -o yaml | \
#     kubeseal --controller-namespace sealed-secrets --format yaml
#
# Replace the encryptedData values below with the output from kubeseal.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: objecttypen
  namespace: publicground
spec:
  encryptedData:
    OBJECTS_SUPERUSER_PASSWORD: ""  # TODO: seal with 655-dmn-poc cluster key
    SECRET_KEY: ""                  # TODO: seal with 655-dmn-poc cluster key
  template:
    metadata:
      name: objecttypen
      namespace: publicground
    type: Opaque
