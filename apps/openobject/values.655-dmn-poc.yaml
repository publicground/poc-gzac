image:
  repository: acr655.azurecr.io/docker.io/maykinmedia/open-object

global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — OBJECTS_SUPERUSER_PASSWORD must be
    # present as a key in the openobject SealedSecret (additionalmanifests/655-dmn-poc/sealedsecret-openobject.yaml)
  initContainer:
    enabled: false
  job:
    enabled: true
    ttlSecondsAfterFinished: ""
  data: |-
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: https://keycloak.dmn-poc.publicground.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openobject
        oidc_rp_client_secret:
          value_from:
            env: KEYCLOAK_CLIENT_SECRET
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENOBJECT_ADMIN

tags:
  redis: false

replicaCount: 1

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see additionalmanifests/655-dmn-poc/httproute.yaml

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

persistence:
  enabled: false

existingSecret: openobject
existingConfigurationSecrets: openobject-config-secrets

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openobject-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "openobject.dmn-poc.publicground.nl"

  disable2fa: true

  database:
    host: "openobject-pg-cluster-rw"
    port: 5432
    username: "openobject"
    name: "openobject"

  siteDomain: "openobject.dmn-poc.publicground.nl"

  cache:
    default: "openobject-redis:6379/0"
    axes: "openobject-redis:6379/0"
    oidc: "openobject-redis:6379/0"

  celery:
    brokerUrl: "redis://openobject-redis:6379/1"
    resultBackend: "redis://openobject-redis:6379/1"
    resultBackendl: "redis://openobject-redis:6379/1"

  isHttps: true

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false
