apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - sealedsecret-openobject-config.yaml
  - sealedsecret-openobject.yaml

patches:
  - path: patches/httproute.yaml

helmCharts:
  - name: openobject
    version: 1.2.0
    repo: https://maykinmedia.github.io/charts/
    releaseName: openobject
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.655-dmn-poc.yaml
