replicaCount: 1

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openobject-pg-cluster-app"
        key: "password"
  - name: KEYCLOAK_DISCOVERY_URL
    value: "http://keycloak.wigo4it.nl/realms/wigo4it/"

settings:
  allowedHosts: "openobject.wigo4it.nl"

  disable2fa: true

  siteDomain: "openobject.wigo4it.nl"

  isHttps: false

worker:
  replicaCount: 1
