apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - sealedsecret-openinwoner-config.yaml
  - sealedsecret-openinwoner.yaml

patches:
  - path: patches/httproute.yaml

helmCharts:
  - name: openinwoner
    version: 2.6.0
    repo: https://maykinmedia.github.io/charts/
    releaseName: openinwoner
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.655-dmn-poc.yaml
