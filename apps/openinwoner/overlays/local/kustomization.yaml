apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - openinwoner-config-sealed.yaml
  - openinwoner-sealed.yaml

patches:
  - path: patches/cnpg.yaml
  - path: patches/redis.yaml
  - path: patches/httproute.yaml

helmCharts:
  - name: openinwoner
    version: 2.6.0
    repo: https://maykinmedia.github.io/charts/
    releaseName: openinwoner
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.local.yaml
