apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - opennotificaties-config-sealed.yaml
  - opennotificaties-sealed.yaml

patches:
  - path: patches/cnpg.yaml
  - path: patches/redis.yaml
  - path: patches/httproute.yaml

helmCharts:
  - name: opennotificaties
    version: 2.1.0
    repo: https://maykinmedia.github.io/charts/
    releaseName: opennotificaties
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.local.yaml
