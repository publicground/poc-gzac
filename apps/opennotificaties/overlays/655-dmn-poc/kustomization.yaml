apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - sealedsecret-opennotificaties-config.yaml
  - sealedsecret-opennotificaties.yaml

patches:
  - path: patches/httproute.yaml

helmCharts:
  - name: opennotificaties
    version: 2.1.0
    repo: https://maykinmedia.github.io/charts/
    releaseName: opennotificaties
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.655-dmn-poc.yaml
