# Sealed with kubeseal against the aks-655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
# opennotificaties_api_secret: NRC API secret for Open Notificaties own ZGW client
# opennotificaties_autorisaties_vng_api_common_secret: secret for Autorisaties API subscription
# opennotificaties_to_openzaak_autorisatie_api_secret: secret used by ON to call OZ Autorisaties API
# openzaak_to_opennotificaties_openzaak_api_secret: secret used by OZ to call Open Notificaties
# KEYCLOAK_CLIENT_SECRET: Keycloak OIDC client secret for the opennotificaties client
#
# To seal KEYCLOAK_CLIENT_SECRET (use same value as OPENNOTIFICATIES_APP_CLIENT_SECRET in keycloak-realm-secrets):
#   echo -n "$SECRET" | kubeseal --raw --from-file=/dev/stdin \
#     --namespace publicground \
#     --name opennotificaties-config-secrets \
#     --context aks-655-dmn-poc \
#     --controller-namespace sealed-secrets \
#     --controller-name sealed-secrets
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: opennotificaties-config-secrets
  namespace: publicground
spec:
  encryptedData:
    opennotificaties_api_secret: 
    opennotificaties_autorisaties_vng_api_common_secret: 
    opennotificaties_to_openzaak_autorisatie_api_secret: 
    openzaak_to_opennotificaties_openzaak_api_secret: 
    KEYCLOAK_CLIENT_SECRET: 
  template:
    metadata:
      name: opennotificaties-config-secrets
      namespace: publicground
    type: Opaque
