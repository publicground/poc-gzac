# Sealed with kubeseal against the aks-655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
# SECRET_KEY: random 50-char alphanumeric
# DJANGO_SUPERUSER_PASSWORD: admin superuser password
# CELERY_BROKER_URL / PUBLISHER_BROKER_URL: RabbitMQ AMQP URL
# CELERY_RESULT_BACKEND: Redis backend URL
# rabbitmq-password / rabbitmq-erlang-cookie: RabbitMQ credentials
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: opennotificaties
  namespace: publicground
spec:
  encryptedData:
    CELERY_BROKER_URL: 
    CELERY_RESULT_BACKEND: 
    DJANGO_SUPERUSER_PASSWORD: 
    PUBLISHER_BROKER_URL: 
    SECRET_KEY: 
    rabbitmq-erlang-cookie: 
    rabbitmq-password: 
  template:
    metadata:
      name: opennotificaties
      namespace: publicground
    type: Opaque
