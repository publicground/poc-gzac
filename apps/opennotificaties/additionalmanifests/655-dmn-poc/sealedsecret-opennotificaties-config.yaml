# Sealed with kubeseal against the aks-655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
#
# TODO: All encryptedData values below are PLACEHOLDERS.
#       Generate and seal the following secrets before deploying:
#
#   opennotificaties_api_secret:
#       Shared secret for Open Notificaties' own API (NRC client_id: open-notificaties)
#   opennotificaties_autorisaties_vng_api_common_secret:
#       Shared secret for Open Notificaties authenticating against the Autorisaties API
#   opennotificaties_to_openzaak_autorisatie_api_secret:
#       Shared secret used by Open Notificaties to call Open Zaak's Autorisaties API
#   openzaak_to_opennotificaties_openzaak_api_secret:
#       Shared secret used by Open Zaak to call Open Notificaties
#
# Example (repeat for each key):
#   kubectl create secret generic opennotificaties-config-secrets \
#     --namespace publicground \
#     --from-literal=opennotificaties_api_secret=<value> \
#     --dry-run=client -o yaml \
#   | kubeseal --controller-namespace sealed-secrets --controller-name sealed-secrets \
#     --format yaml
#
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: opennotificaties-config-secrets
  namespace: publicground
spec:
  encryptedData:
    opennotificaties_api_secret: PLACEHOLDER
    opennotificaties_autorisaties_vng_api_common_secret: PLACEHOLDER
    opennotificaties_to_openzaak_autorisatie_api_secret: PLACEHOLDER
    openzaak_to_opennotificaties_openzaak_api_secret: PLACEHOLDER
  template:
    metadata:
      name: opennotificaties-config-secrets
      namespace: publicground
    type: Opaque
