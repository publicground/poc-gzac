global:
  configuration:
    enabled: true
    overwrite: true

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: admin
    password: dummy123
    email: "peterdummy@wigo4it.nl"
  job:
    enabled: true
    backoffLimit: 6
    restartPolicy: OnFailure
  data: |-
    oidc_db_config_enable: false
    zgw_consumers_config_enable: True
    zgw_consumers:
      services:
        - identifier: autorisaties-api
          label: Autorisaties API
          api_root: http://openzaak.wigo4it.nl/autorisaties/api/v1/
          api_type: ac
          auth_type: zgw
          client_id: open-notificaties
          secret:
            value_from:
              env: opennotificaties_autorisatie_api_secret
          user_id: open-notificaties
          user_representation: Open Notificaties
    autorisaties_api_config_enable: True
    autorisaties_api:
      # Configure Open Notificaties to make use of Open Zaak's Autorisaties API
      authorizations_api_service_identifier: autorisaties-api
    vng_api_common_credentials_config_enable: True
    vng_api_common_credentials:
      items:
      # Credentials for Open Zaak to be able to make requests to Open Notificaties
      - identifier: open-zaak
        secret:
          value_from:
            env: opennotificaties_openzaak_vng_api_common_secret
      # Credentials for Open Notificaties, required for autorisaties subscription
      - identifier: open-notificaties
        secret:
          value_from:
            env: opennotificaties_autorisaties_vng_api_common_secret
    notifications_kanalen_config_enable: false
    # notifications_kanalen_config:
    #   items:
    #     - naam: autorisaties
    #       documentatie_link: http://openzaak.wigo4it.nl/ref/kanalen/#/autorisaties
    #       filters: []
    #     - naam: besluittypen
    #       documentatie_link: http://openzaak.wigo4it.nl/ref/kanalen/#/besluittypen
    #       filters:
    #         - catalogus
    #     - naam: informatieobjecttypen
    #       documentatie_link: http://openzaak.wigo4it.nl/ref/kanalen/#/informatieobjecttypen
    #       filters:
    #         - catalogus
    #     - naam: zaaktypen
    #       documentatie_link: http://openzaak.wigo4it.nl/ref/kanalen/#/zaaktypen
    #       filters:
    #         - catalogus
    #     - naam: zaken
    #       documentatie_link: http://openzaak.wigo4it.nl/ref/kanalen/#/zaken
    #       filters:
    #         - bronorganisatie
    #         - zaaktype
    #         - vertrouwelijkheidaanduiding
    #     - naam: documenten
    #       documentatie_link: http://openzaak.wigo4it.nl/ref/kanalen/#/documenten
    #       filters:
    #         - bronorganisatie
    #         - informatieobjecttype
    #         - vertrouwelijkheidaanduiding
