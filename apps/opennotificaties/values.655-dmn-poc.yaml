global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  notificatiesAuthorization:
    enabled: false
  notificaties:
    enabled: false
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — DJANGO_SUPERUSER_PASSWORD must be
    # present as a key in the opennotificaties SealedSecret (additionalmanifests/655-dmn-poc/sealedsecret-opennotificaties.yaml)
  job:
    enabled: false

tags:
  redis: false

replicaCount: 1

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see additionalmanifests/655-dmn-poc/httproute.yaml

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

persistence:
  enabled: false

existingSecret: opennotificaties

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "opennotificaties-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "opennotificaties.dmn-poc.publicground.nl"
  useXForwardedHost: true

  database:
    host: "opennotificaties-pg-cluster-rw"
    port: 5432
    username: "opennotificaties"
    name: "opennotificaties"

  cache:
    default: "opennotificaties-redis:6379/0"
    axes: "opennotificaties-redis:6379/0"

  disable2fa: false

  isHttps: true

  siteDomain: "opennotificaties.dmn-poc.publicground.nl"

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false

rabbitmq:
  enabled: true
  networkPolicy:
    enabled: false
  auth:
    username: user
    existingPasswordSecret: opennotificaties
    existingErlangSecret: opennotificaties
  persistence:
    enabled: false
  rbac:
    create: false
  clustering:
    enabled: false
  serviceAccount:
    create: true
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"
