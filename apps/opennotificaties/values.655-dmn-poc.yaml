image:
  repository: acr655.azurecr.io/docker.io/openzaak/open-notificaties

global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}
  security:
    allowInsecureImages: true

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — DJANGO_SUPERUSER_PASSWORD must be
    # present as a key in the opennotificaties SealedSecret (additionalmanifests/655-dmn-poc/sealedsecret-opennotificaties.yaml)
  job:
    enabled: true
    backoffLimit: 6
    restartPolicy: OnFailure
  data: |-
    oidc_db_config_enable: false
    zgw_consumers_config_enable: True
    zgw_consumers:
      services:
        - identifier: autorisaties-api
          label: Autorisaties API
          api_root: https://openzaak.dmn-poc.publicground.nl/autorisaties/api/v1/
          api_type: ac
          auth_type: zgw
          client_id: open-notificaties
          secret:
            value_from:
              env: opennotificaties_to_openzaak_autorisatie_api_secret
          user_id: open-notificaties
          user_representation: Open Notificaties
        - identifier: notificaties-api
          label: Notificaties API
          api_root: https://opennotificaties.dmn-poc.publicground.nl/api/v1/
          api_type: nrc
          auth_type: zgw
          client_id: open-notificaties
          secret:
            value_from:
              env: opennotificaties_api_secret
          user_id: open-notificaties
          user_representation: Open Notificaties Demodam
    autorisaties_api_config_enable: True
    autorisaties_api:
      authorizations_api_service_identifier: autorisaties-api
    vng_api_common_credentials_config_enable: True
    vng_api_common_credentials:
      items:
      - identifier: open-zaak
        secret:
          value_from:
            env: openzaak_to_opennotificaties_openzaak_api_secret
      - identifier: open-notificaties
        secret:
          value_from:
            env: opennotificaties_autorisaties_vng_api_common_secret
    notifications_kanalen_config_enable: true
    notifications_kanalen_config:
      items:
        - naam: autorisaties
          documentatie_link: https://openzaak.dmn-poc.publicground.nl/ref/kanalen/#/autorisaties
          filters: []
        - naam: besluittypen
          documentatie_link: https://openzaak.dmn-poc.publicground.nl/ref/kanalen/#/besluittypen
          filters:
            - catalogus
        - naam: informatieobjecttypen
          documentatie_link: https://openzaak.dmn-poc.publicground.nl/ref/kanalen/#/informatieobjecttypen
          filters:
            - catalogus
        - naam: zaaktypen
          documentatie_link: https://openzaak.dmn-poc.publicground.nl/ref/kanalen/#/zaaktypen
          filters:
            - catalogus
        - naam: zaken
          documentatie_link: https://openzaak.dmn-poc.publicground.nl/ref/kanalen/#/zaken
          filters:
            - bronorganisatie
            - zaaktype
            - vertrouwelijkheidaanduiding
        - naam: documenten
          documentatie_link: https://openzaak.dmn-poc.publicground.nl/ref/kanalen/#/documenten
          filters:
            - bronorganisatie
            - informatieobjecttype
            - vertrouwelijkheidaanduiding
        - naam: besluiten
          documentatie_link: https://openzaak.dmn-poc.publicground.nl/ref/kanalen/#/besluiten
          filters:
            - verantwoordelijke_organisatie
            - besluittype
    notifications_abonnementen_config_enable: false
    notifications_config_enable: true
    notifications_config:
      notifications_api_service_identifier: notificaties-api
      notification_delivery_max_retries: 2
      notification_delivery_retry_backoff: 2
      notification_delivery_retry_backoff_max: 3
    sites_config_enable: true
    sites_config:
      items:
        - domain: opennotificaties.dmn-poc.publicground.nl
          name: Open Notificaties
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: https://keycloak.dmn-poc.publicground.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: opennotificaties
        oidc_rp_client_secret:
          value_from:
             env: KEYCLOAK_CLIENT_SECRET
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENNOTIFICATIES_ADMIN

tags:
  redis: false

replicaCount: 1

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see additionalmanifests/655-dmn-poc/httproute.yaml

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"

persistence:
  enabled: false

existingSecret: opennotificaties
existingConfigurationSecrets: opennotificaties-config-secrets

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "opennotificaties-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "opennotificaties.dmn-poc.publicground.nl"
  useXForwardedHost: true

  database:
    host: "opennotificaties-pg-cluster-rw"
    port: 5432
    username: "opennotificaties"
    name: "opennotificaties"

  cache:
    default: "opennotificaties-redis:6379/0"
    axes: "opennotificaties-redis:6379/0"

  disable2fa: true

  isHttps: true

  siteDomain: "opennotificaties.dmn-poc.publicground.nl"

livenessProbe:
  initialDelaySeconds: 120  # extra time for migrate + createinitialsuperuser before uWSGI starts
  periodSeconds: 10
  failureThreshold: 6

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false

rabbitmq:
  enabled: true
  image:
    registry: acr655.azurecr.io/docker.io
    repository: bitnamilegacy/rabbitmq
  networkPolicy:
    enabled: false
  auth:
    username: user
    existingPasswordSecret: opennotificaties
    existingErlangSecret: opennotificaties
  persistence:
    enabled: false
  rbac:
    create: false
  clustering:
    enabled: false
  serviceAccount:
    create: true
    automountServiceAccountToken: false

  resources:
    requests:
      cpu: "50m"
      memory: "256Mi"
    limits:
      cpu: "200m"
      memory: "512Mi"
