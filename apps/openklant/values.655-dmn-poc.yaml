image:
  repository: acr655.azurecr.io/docker.io/maykinmedia/open-klant

global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — DJANGO_SUPERUSER_PASSWORD must be
    # present as a key in the openklant SealedSecret (additionalmanifests/655-dmn-poc/sealedsecret-openklant.yaml)
  initContainer:
    enabled: false
  job:
    enabled: true
    ttlSecondsAfterFinished: ""
  data: |-
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: https://keycloak.dmn-poc.publicground.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openklant
        oidc_rp_client_secret:
          value_from:
            env: KEYCLOAK_CLIENT_SECRET
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENKLANT_ADMIN

tags:
  redis: false

replicaCount: 1

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see additionalmanifests/655-dmn-poc/httproute.yaml

resources:
  requests:
    memory: "1Gi"
    cpu: "250m"
  limits:
    memory: "3Gi"
    cpu: "500m"

persistence:
  enabled: false

existingSecret: openklant
existingConfigurationSecrets: openklant-config-secrets

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openklant-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "openklant.dmn-poc.publicground.nl"

  database:
    host: "openklant-pg-cluster-rw"
    port: 5432
    username: "openklant"
    name: "openklant"

  isHttps: true

  disable2fa: true

  cache:
    default: "openklant-redis:6379/0"
    axes: "openklant-redis:6379/0"

  celery:
    brokerUrl: "redis://openklant-redis:6379/1"
    resultBackend: "redis://openklant-redis:6379/1"
    resultBackendl: "redis://openklant-redis:6379/1"

  siteDomain: "openklant.dmn-poc.publicground.nl"


worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false
