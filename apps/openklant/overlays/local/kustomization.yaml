apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - openklant-config-sealed.yaml
  - openklant-sealed.yaml

patches:
  - path: patches/cnpg.yaml
  - path: patches/redis.yaml
  - path: patches/httproute.yaml

helmCharts:
  - name: openklant
    version: 1.14.2
    repo: https://maykinmedia.github.io/charts/
    releaseName: openklant
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.local.yaml
