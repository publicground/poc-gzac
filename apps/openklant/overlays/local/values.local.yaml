image:
  repository: docker.io/maykinmedia/open-klant

replicaCount: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "3Gi"
    cpu: "500m"

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openklant-pg-cluster-app"
        key: "password"
  - name: KEYCLOAK_DISCOVERY_URL
    value: "http://keycloak.wigo4it.nl/realms/publicground/"

settings:
  allowedHosts: "openklant.wigo4it.nl"

  isHttps: false

  disable2fa: true

  siteDomain: "openklant.wigo4it.nl"

worker:
  replicaCount: 1
