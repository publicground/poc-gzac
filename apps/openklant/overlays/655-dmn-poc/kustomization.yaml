apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - sealedsecret-openklant-config.yaml
  - sealedsecret-openklant.yaml

patches:
  - path: patches/httproute.yaml

helmCharts:
  - name: openklant
    version: 1.14.2
    repo: https://maykinmedia.github.io/charts/
    releaseName: openklant
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.655-dmn-poc.yaml
