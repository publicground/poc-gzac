global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    password: ""
    email: "peterdummy@wigo4it.nl"
  initContainer:
    enabled: false
  job:
    enabled: true
    ttlSecondsAfterFinished: ""
  data: |-
    #   tokenauth_config_enable: true
    #   tokenauth:
    #     items:
    #       - identifier: openformulier-token
    #         token:
    #           value_from:
    #             env: openformulieren_objecten_token
    #         contact_person: Person 1
    #         email: person-1@example.com
    #         organization: Organization 1
    #         application: Application 1
    #         administration: Administration 1
    #         permissions:
    #           - object_type: 366c9b88-a870-438c-b0ec-a121cd51f1dd
    #             mode: read_and_write
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: http://keycloak.wigo4it.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openklant
        oidc_rp_client_secret:
          value_from:
            env: KEYCLOAK_CLIENT_SECRET
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENKLANT_ADMIN

tags:
  redis: false

replicaCount: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "2048Mi"
    cpu: "500m"

persistence:
  enabled: false

existingSecret: openklant
existingConfigurationSecrets: openklant-config-secrets

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openklant-pg-cluster-app"
        key: "password"

settings:
  # allowedHosts: "localhost, openklant, openklant.wigo4it.nl"

  database:
    host: "openklant-pg-cluster-rw"
    port: 5432
    username: "openklant"
    name: "openklant"

  isHttps: false

  disable2fa: true

  cache:
    default: "openklant-redis:6379/0"
    axes: "openklant-redis:6379/0"

  celery:
    brokerUrl: "redis://openklant-redis:6379/1"
    resultBackend: "redis://openklant-redis:6379/1"
    resultBackendl: "redis://openklant-redis:6379/1"

  siteDomain: "openklant.wigo4it.nl"

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false
