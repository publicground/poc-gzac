# Sealed with kubeseal against the aks-655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
# MEDEWERKER_GZAC_PASSWORD: password for medewerkergzac user
# ADMIN_GZAC_PASSWORD: password for admingzac user
# GZAC_BACKEND_APP_CLIENT_SECRET: Keycloak client secret for gzac-backend
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-realm-secrets
  namespace: keycloak
spec:
  encryptedData:
    ADMIN_GZAC_PASSWORD: 
    GZAC_BACKEND_APP_CLIENT_SECRET: 
    MEDEWERKER_GZAC_PASSWORD: 
  template:
    metadata:
      name: keycloak-realm-secrets
      namespace: keycloak
    type: Opaque
