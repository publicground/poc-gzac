# Sealed with kubeseal against the aks-655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
# MEDEWERKER_GZAC_PASSWORD: password for medewerkergzac user
# ADMIN_GZAC_PASSWORD: password for admingzac user
# GZAC_BACKEND_APP_CLIENT_SECRET: Keycloak client secret for gzac-backend
# ADMIN_OPENZAAK_PASSWORD: password for adminopenzaak user
# ADMIN_OPENNOTIFICATIES_PASSWORD: password for adminopennotificaties user
# ADMIN_OPENOBJECT_PASSWORD: password for adminopenobject user
# OPENZAAK_APP_CLIENT_SECRET: Keycloak client secret for openzaak (same value as openzaak-config-secrets.KEYCLOAK_CLIENT_SECRET)
# OPENNOTIFICATIES_APP_CLIENT_SECRET: Keycloak client secret for opennotificaties (same value as opennotificaties-config-secrets.KEYCLOAK_CLIENT_SECRET)
# OPENOBJECT_APP_CLIENT_SECRET: Keycloak client secret for openobject (same value as openobject-config-secrets.KEYCLOAK_CLIENT_SECRET)
#
# To seal new secrets:
#   echo -n "$VALUE" | kubeseal --raw --from-file=/dev/stdin \
#     --namespace keycloak \
#     --name keycloak-realm-secrets \
#     --context aks-655-dmn-poc \
#     --controller-namespace sealed-secrets \
#     --controller-name sealed-secrets
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-realm-secrets
  namespace: keycloak
spec:
  encryptedData:
    ADMIN_GZAC_PASSWORD: 
    ADMIN_OPENNOTIFICATIES_PASSWORD: 
    ADMIN_OPENOBJECT_PASSWORD: 
    ADMIN_OPENZAAK_PASSWORD: 
    ANTON_PASSWORD: 
    GZAC_BACKEND_APP_CLIENT_SECRET: 
    MEDEWERKER_GZAC_PASSWORD: 
    OPENNOTIFICATIES_APP_CLIENT_SECRET: 
    OPENOBJECT_APP_CLIENT_SECRET: 
    OPENZAAK_APP_CLIENT_SECRET: 
  template:
    metadata:
      name: keycloak-realm-secrets
      namespace: keycloak
    type: Opaque
