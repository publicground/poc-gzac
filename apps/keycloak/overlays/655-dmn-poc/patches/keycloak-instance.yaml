apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
spec:
  hostname:
    hostname: keycloak.dmn-poc.publicground.nl
    strict: false
  unsupported:
    podTemplate:
      spec:
        containers:
          - name: keycloak
            envFrom:
              - secretRef:
                  name: keycloak-realm-secrets
