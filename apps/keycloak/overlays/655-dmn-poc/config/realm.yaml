clients:
  - clientId: "gzac-frontend"
    name: "gzac frontend"
    enabled: true
    protocol: "openid-connect"
    publicClient: true
    redirectUris:
      - "https://gzac.dmn-poc.publicground.nl/*"
    webOrigins:
      - "https://gzac.dmn-poc.publicground.nl"
    standardFlowEnabled: true
    directAccessGrantsEnabled: true
  - clientId: "gzac-backend"
    name: "gzac backend"
    enabled: true
    protocol: "openid-connect"
    clientAuthenticatorType: "client-secret"
    secret: "$(env:GZAC_BACKEND_APP_CLIENT_SECRET)" # Verwijst naar een secret in de config-cli job
    redirectUris:
      - "https://gzac.dmn-poc.publicground.nl/*"
    webOrigins:
      - "https://gzac.dmn-poc.publicground.nl"
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
  - clientId: "openzaak"
    name: "openzaak"
    enabled: true
    protocol: "openid-connect"
    clientAuthenticatorType: "client-secret"
    secret: "$(env:OPENZAAK_APP_CLIENT_SECRET)" # Verwijst naar een secret in de config-cli job
    redirectUris:
      - "https://openzaak.dmn-poc.publicground.nl/oidc/callback/"
    webOrigins:
      - "https://openzaak.dmn-poc.publicground.nl"
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: true
    serviceAccountsEnabled: false
    protocolMappers:
      - name: "oz-client-roles-mapper-to-roles-claim"
        protocol: openid-connect
        protocolMapper: oidc-usermodel-client-role-mapper
        consentRequired: false
        config:
          claim.name: "roles"
          id.token.claim: "true"
          access.token.claim: "true"
          usermodel.clientRoleMapping.clientId: "openzaak"
          multivalued: "true"
          jsonType.label: "String"
