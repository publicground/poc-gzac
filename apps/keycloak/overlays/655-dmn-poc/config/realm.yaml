        description: "Admin rol voor OpenArchiefbeheer"
    openformulieren:
      - name: OPENFORMULIEREN_ADMIN
        clientRole: true
        description: "Admin rol voor OpenFormulieren"
    openbeheer:
      - name: OPENBEHEER_ADMIN
        clientRole: true
        description: "Admin rol voor OpenBeheer"
    openproduct:
      - name: OPENPRODUCT_ADMIN
        clientRole: true
        description: "Admin rol voor OpenProduct"
    referentielijsten:
      - name: REFERENTIELIJSTEN_ADMIN
        clientRole: true
        description: "Admin rol voor Referentielijsten"
    openvtb:
      - name: OPENVTB_ADMIN
        clientRole: true
        description: "Admin rol voor OpenVTB"
    openorganisatie:
