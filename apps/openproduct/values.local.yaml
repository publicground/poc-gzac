image:
  repository: maykinmedia/open-product # needed because of bug in chart
  # tag: 1.8.0

global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: admin
    password: dummy123
    email: "peterdummy@wigo4it.nl"
  job:
    enabled: true
    ttlSecondsAfterFinished: ""
  data: |-
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: http://keycloak.wigo4it.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openproduct
        oidc_rp_client_secret: '${KEYCLOAK_CLIENT_SECRET}'
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENPRODUCT_ADMIN

tags:
  redis: false

replicaCount: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

persistence:
  enabled: false

existingSecret: openproduct
existingConfigurationSecrets: openproduct-config-secrets

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openproduct-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "localhost, openproduct, openproduct.wigo4it.nl"

  disable2fa: true

  database:
    host: "openproduct-pg-cluster-rw"
    port: 5432
    username: "openproduct"
    name: "openproduct"

  siteDomain: "openproduct.wigo4it.nl"

  cache:
    default: "openproduct-redis:6379/0"
    axes: "openproduct-redis:6379/0"

  celery:
    broker: "redis://openproduct-redis:6379/1"
    result_backend: "redis://openproduct-redis:6379/1"
    resultBackendl: "redis://openproduct-redis:6379/1"

  isHttps: false

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

flower:
  enabled: false

redis:
  enabled: false
