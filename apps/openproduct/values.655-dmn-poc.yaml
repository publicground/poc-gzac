image:
  repository: acr655.azurecr.io/docker.io/maykinmedia/open-product

global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  job:
    enabled: true
    ttlSecondsAfterFinished: ""
  data: |-
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: https://keycloak.dmn-poc.publicground.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openproduct
        oidc_rp_client_secret: '${KEYCLOAK_CLIENT_SECRET}'
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENPRODUCT_ADMIN

    zgw_consumers_config_enable: true
    zgw_consumers:
      services:
        - identifier: notificaties-api
          label: Notificaties API
          api_root: https://opennotificaties.dmn-poc.publicground.nl/api/v1/
          api_type: nrc
          auth_type: zgw
          client_id: openproduct
          secret: ${OPENZAAK_CLIENT_SECRET}
        - identifier: zaken-api
          label: Zaken API
          api_root: https://openzaak.dmn-poc.publicground.nl/zaken/api/v1/
          api_type: zrc
          auth_type: zgw
          client_id: openproduct
          secret: ${OPENZAAK_CLIENT_SECRET}
        - identifier: documenten-api
          label: Documenten API
          api_root: https://openzaak.dmn-poc.publicground.nl/documenten/api/v1/
          api_type: drc
          auth_type: zgw
          client_id: openproduct
          secret: ${OPENZAAK_CLIENT_SECRET}
        - identifier: zaaktypen-api
          label: Zaaktypen API
          api_root: https://openzaak.dmn-poc.publicground.nl/catalogi/api/v1/
          api_type: ztc
          auth_type: zgw
          client_id: openproduct
          secret: ${OPENZAAK_CLIENT_SECRET}

    notifications_config_enable: true
    notifications_config:
      notifications_api_service_identifier: notificaties-api

    externeverwijzing_config_enable: true
    externeverwijzing_config:
      zaaktypen_url: https://openzaak.dmn-poc.publicground.nl/catalogi/api/v1/

tags:
  redis: false

replicaCount: 1

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see additionalmanifests/655-dmn-poc/httproute.yaml

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

persistence:
  enabled: false

existingSecret: openproduct
existingConfigurationSecrets: openproduct-config-secrets

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openproduct-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "openproduct.dmn-poc.publicground.nl"

  disable2fa: false

  database:
    host: "openproduct-pg-cluster-rw"
    port: 5432
    username: "openproduct"
    name: "openproduct"

  siteDomain: "openproduct.dmn-poc.publicground.nl"

  cache:
    default: "openproduct-redis:6379/0"
    axes: "openproduct-redis:6379/0"

  celery:
    brokerUrl: "redis://openproduct-redis:6379/1"
    result_backend: "redis://openproduct-redis:6379/1"
    resultBackendl: "redis://openproduct-redis:6379/1"

  isHttps: false

worker:
  livenessProbe:
    enabled: true

flower:
  enabled: false

redis:
  enabled: false
