image:
  repository: maykinmedia/open-product # needed because of bug in chart
  # tag: 1.8.0

configuration:
  superuser:
    username: admin
    password: dummy123
    email: "peterdummy@wigo4it.nl"
  data: |-
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: http://keycloak.wigo4it.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openproduct
        oidc_rp_client_secret: '${KEYCLOAK_CLIENT_SECRET}'
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENPRODUCT_ADMIN

    zgw_consumers_config_enable: true
    zgw_consumers:
      services:
        - identifier: notificaties-api
          label: Notificaties API
          api_root: http://opennotificaties.wigo4it.nl/api/v1/
          api_type: nrc
          auth_type: zgw
          client_id: openproduct
          secret: ${OPENZAAK_CLIENT_SECRET}
        - identifier: zaken-api
          label: Zaken API
          api_root: http://openzaak.wigo4it.nl/zaken/api/v1/
          api_type: zrc
          auth_type: zgw
          client_id: openproduct
          secret: ${OPENZAAK_CLIENT_SECRET}
        - identifier: documenten-api
          label: Documenten API
          api_root: http://openzaak.wigo4it.nl/documenten/api/v1/
          api_type: drc
          auth_type: zgw
          client_id: openproduct
          secret: ${OPENZAAK_CLIENT_SECRET}
        - identifier: zaaktypen-api
          label: Zaaktypen API
          api_root: http://openzaak.wigo4it.nl/catalogi/api/v1/
          api_type: ztc
          auth_type: zgw
          client_id: openproduct
          secret: ${OPENZAAK_CLIENT_SECRET}

    notifications_config_enable: true
    notifications_config:
      notifications_api_service_identifier: notificaties-api

    externeverwijzing_config_enable: true
    externeverwijzing_config:
      zaaktypen_url: http://openzaak.wigo4it.nl/catalogi/api/v1/

replicaCount: 1

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openproduct-pg-cluster-app"
        key: "password"
  - name: KEYCLOAK_DISCOVERY_URL
    value: "http://keycloak.wigo4it.nl/realms/publicground/"

settings:
  allowedHosts: "openproduct.wigo4it.nl"

  disable2fa: true

  siteDomain: "openproduct.wigo4it.nl"

  isHttps: false

worker:
  replicaCount: 1
