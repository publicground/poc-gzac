apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - openproduct-config-sealed.yaml
  - openproduct-sealed.yaml

patches:
  - path: patches/cnpg.yaml
  - path: patches/redis.yaml
  - path: patches/httproute.yaml

helmCharts:
  - name: openproduct
    version: 0.4.1
    repo: https://maykinmedia.github.io/charts/
    releaseName: openproduct
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.local.yaml
