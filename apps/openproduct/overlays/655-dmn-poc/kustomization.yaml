apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - sealedsecret-openproduct-config.yaml
  - sealedsecret-openproduct.yaml

patches:
  - path: patches/httproute.yaml

helmCharts:
  - name: openproduct
    version: 0.4.1
    repo: https://maykinmedia.github.io/charts/
    releaseName: openproduct
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.655-dmn-poc.yaml
