apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gzac-frontend
  namespace: publicground
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "gzac.dmn-poc.publicground.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: gzac-frontend
          port: 8080
          weight: 1
