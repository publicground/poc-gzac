persistence:
  storageClassName: "azurefile-dmn-poc"

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openorganisatie-pg-cluster-app"
        key: "password"
  - name: KEYCLOAK_DISCOVERY_URL
    value: "https://keycloak.dmn-poc.publicground.nl/realms/publicground/"

settings:
  allowedHosts: "openorganisatie.dmn-poc.publicground.nl"

  siteDomain: "openorganisatie.dmn-poc.publicground.nl"
