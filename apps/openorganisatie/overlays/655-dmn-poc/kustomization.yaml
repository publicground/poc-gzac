apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - sealedsecret-openorganisatie-config.yaml
  - sealedsecret-openorganisatie.yaml

patches:
  - path: patches/httproute.yaml

helmCharts:
  - name: openorganisatie
    version: 0.2.0
    repo: https://maykinmedia.github.io/charts/
    releaseName: openorganisatie
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.655-dmn-poc.yaml
