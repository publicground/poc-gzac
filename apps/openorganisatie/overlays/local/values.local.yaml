image:
  repository: docker.io/maykinmedia/open-organisatie

replicaCount: 1

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openorganisatie-pg-cluster-app"
        key: "password"
  - name: KEYCLOAK_DISCOVERY_URL
    value: "http://keycloak.wigo4it.nl/realms/publicground/"

settings:
  allowedHosts: "openorganisatie.wigo4it.nl"

  disable2fa: true

  siteDomain: "openorganisatie.wigo4it.nl"

  isHttps: false

worker:
  replicaCount: 1
