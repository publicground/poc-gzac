apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openorganisatie
  namespace: publicground
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "openorganisatie.dmn-poc.publicground.nl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: openorganisatie
          port: 80
          weight: 1
