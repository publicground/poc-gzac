apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - ../../base
  - openformulieren-cl-config-sealed.yaml
  - openformulieren-cl-secret-sealed.yaml

patches:
  - path: patches/httproute.yaml

helmCharts:
  - name: openforms
    version: 1.13.0
    repo: https://maykinmedia.github.io/charts/
    releaseName: openformulieren
    namespace: publicground
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.655-dmn-poc.yaml
