image:
  repository: docker.io/openformulieren/open-forms

nginx:
  image:
    repository: docker.io/nginxinc/nginx-unprivileged

global:
  configuration:
    enabled: false

configuration:
  enabled: false

replicaCount: 1

# resources:
#   requests:
#     memory: "512Mi"
#     cpu: "250m"
#   limits:
#     memory: "2Gi"
#     cpu: "1"

persistence:
  enabled: false

existingSecret: openformulieren
existingConfigurationSecrets: null

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openformulieren-pg-cluster-app"
        key: "password"
  - name: LOG_STDOUT
    value: "true"
  - name: LOG_LEVEL
    value: DEBUG
  - name: KEYCLOAK_DISCOVERY_URL
    value: "http://keycloak.wigo4it.nl/realms/publicground/"

settings:
  allowedHosts: "openformulieren.wigo4it.nl"
  baseUrl: "http://openformulieren.wigo4it.nl"

  # database:
