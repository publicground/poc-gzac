image:
  repository: acr655.azurecr.io/docker.io/openformulieren/open-forms

nginx:
  image:
    repository: acr655.azurecr.io/docker.io/nginxinc/nginx-unprivileged

global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — DJANGO_SUPERUSER_PASSWORD must be
    # present as a key in the openklant SealedSecret (additionalmanifests/655-dmn-poc/sealedsecret-openklant.yaml)
  initContainer:
    enabled: false
  job:
    enabled: true
    ttlSecondsAfterFinished: ""
  data: |-
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: https://keycloak.dmn-poc.publicground.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openformulieren
        oidc_rp_client_secret: "${KEYCLOAK_CLIENT_SECRET}"
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENFORMULIEREN_ADMIN

tags:
  redis: false

replicaCount: 1

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "2Gi"
    cpu: "1"

persistence:
  storageClassName: "azurefile-dmn-poc"

existingSecret: openformulieren
existingConfigurationSecrets: openformulieren-config-secrets

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openformulieren-pg-cluster-app"
        key: "password"
  - name: LOG_STDOUT
    value: "true"
  - name: LOG_LEVEL
    value: DEBUG

settings:
  allowedHosts: "localhost,openformulieren,openformulieren.dmn-poc.publicground.nl"
  baseUrl: "https://openformulieren.dmn-poc.publicground.nl"

  database:
    host: "openformulieren-pg-cluster-rw"
    port: 5432
    name: "openformulieren"
    username: "openformulieren"

  cache:
    default: "openformulieren-redis:6379/0"
    axes: "openformulieren-redis:6379/0"
    portalLocker: "openformulieren-redis:6379/0"

  celery:
    brokerUrl: "redis://openformulieren-redis:6379/1"
    resultBackendl: "redis://openformulieren-redis:6379/1"

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false
