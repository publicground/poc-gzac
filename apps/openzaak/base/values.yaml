image:
  repository: acr655.azurecr.io/docker.io/openzaak/open-zaak

nginx:
  image:
    repository: acr655.azurecr.io/docker.io/nginxinc/nginx-unprivileged

global:
  configuration:
    enabled: true
configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — DJANGO_SUPERUSER_PASSWORD must be
    # present as a key in the openzaak SealedSecret (overlays/655-dmn-poc/sealedsecret-openzaak.yaml)
  job:
    enabled: true
    ttlSecondsAfterFinished: ""

tags:
  redis: false

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see additionalmanifests/655-dmn-poc/httproute.yaml

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "3Gi"
    cpu: "1"

persistence:
  enabled: false

existingSecret: openzaak
existingConfigurationSecrets: openzaak-config-secrets

settings:
  isHttps: true

  disable2fa: true

  database:
    host: "openzaak-pg-cluster-rw"
    port: 5432
    name: "openzaak"
    username: "openzaak"

  cache:
    default: "openzaak-redis:6379/0"
    axes: "openzaak-redis:6379/1"
    portalLocker: "openzaak-redis:6379/2"

  celery:
    brokerUrl: "redis://openzaak-redis:6379/1"
    resultBackend: "redis://openzaak-redis:6379/1"
    resultBackendl: "redis://openzaak-redis:6379/1"

  messageBroker:
    celeryBroker: "redis://openzaak-redis:6379/1"
    celeryResultBackend: "redis://openzaak-redis:6379/1"

worker:
  livenessProbe:
    enabled: true

flower:
  enabled: false

redis:
  enabled: false
