apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: publicground

resources:
  - cnpg.yaml
  - redis.yaml
  - httproute.yaml
  - autorisaties-job.yaml

configMapGenerator:
  - name: openzaak-autorisaties
    files:
      - autorisaties/zet-autorisaties.py
    options:
      disableNameSuffixHash: true
