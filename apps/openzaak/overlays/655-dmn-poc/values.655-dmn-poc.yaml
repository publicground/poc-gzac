configuration:
  data: |-
    zgw_consumers_config_enable: true
    zgw_consumers:
      services:
        - identifier: notifications-api
          label: Notificaties API
          api_root: https://opennotificaties.dmn-poc.publicground.nl/api/v1/
          api_type: nrc
          auth_type: zgw
          client_id: open-zaak
          secret:
            value_from:
              env: openzaak_to_opennotificaties_secret
          user_id: open-zaak
          user_representation: Open Zaak

    notifications_config_enable: true
    notifications_config:
      notifications_api_service_identifier: notifications-api
      notification_delivery_max_retries: 1
      notification_delivery_retry_backoff: 2
      notification_delivery_retry_backoff_max: 3

    vng_api_common_applicaties_config_enable: false
    vng_api_common_applicaties:
      items:
      - uuid: 78591bab-9a00-4887-849c-53b21a67782f
        client_ids:
        - gzac
        label: GZAC
        heeft_alle_autorisaties: true
      - uuid: e7d02fd2-5a89-4a5d-b73f-d767d8ece22d
        client_ids:
        - open-notificaties
        label: Open Notificaties
        heeft_alle_autorisaties: true
      - uuid: c975302f-3100-438c-96d1-e00c79ef0bbe
        client_ids:
        - open-zaak
        label: Open Zaak
        heeft_alle_autorisaties: true
      - uuid: c975302f-3100-438c-96d1-e00c79ef0bbf
        client_ids:
        - open-archiefbeheer
        label: Open Archiefbeheer
        heeft_alle_autorisaties: true
      - uuid: c975302f-3100-438c-96d1-e00c79ef0bb0
        client_ids:
        - open-product
        label: Open Product
        heeft_alle_autorisaties: true
        # heeft_alle_autorisaties needs to be true for api call to work. api call will set to false and set correct permissions
    vng_api_common_credentials_config_enable: false
    vng_api_common_credentials:
      items:
      - identifier: gzac
        secret:
          value_from:
            env: OZ_APP_GZAC_SECRET
      - identifier: open-notificaties
        secret:
          value_from:
            env: opennotificaties_to_openzaak_secret
      - identifier: open-zaak
        secret:
          value_from:
            env: opennotificaties_api_secret
      - identifier: open-archiefbeheer
        secret:
          value_from:
            env: OZ_APP_OPENARCHIEFBEHEER_SECRET
      - identifier: open-product
        secret:
          value_from:
            env: OZ_APP_OPENPRODUCT_SECRET
    sites_config_enable: true
    sites_config:
      items:
      - domain: openzaak.dmn-poc.publicground.nl
        name: Open-Zaak Test
    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint:
            value_from:
              env: KEYCLOAK_DISCOVERY_URL
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openzaak
        oidc_rp_client_secret:
          value_from:
             env: KEYCLOAK_CLIENT_SECRET
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENZAAK_ADMIN

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openzaak-pg-cluster-app"
        key: "password"
  - name: KEYCLOAK_DISCOVERY_URL
    value: "https://keycloak.dmn-poc.publicground.nl/realms/publicground/"

settings:
  allowedHosts: "openzaak.dmn-poc.publicground.nl"

  siteDomain: "openzaak.dmn-poc.publicground.nl"
