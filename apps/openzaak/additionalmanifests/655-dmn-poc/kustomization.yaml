apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sealedsecret-openzaak-config.yaml
  - sealedsecret-openzaak.yaml
  - cnpg.yaml
  - redis.yaml
  - job.yaml
  - httproute.yaml

configMapGenerator:
  - name: openzaak-autorisaties-script
    files:
      - permissies/set-permissions.py
      - permissies/requirements.txt
  - name: openzaak-autorisaties-json-files
    files:
      - permissies/config/open-product.json
    options:
      disableNameSuffixHash: true
