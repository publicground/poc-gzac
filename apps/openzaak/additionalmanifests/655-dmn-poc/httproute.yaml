apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openzaak
  namespace: publicground
spec:
  parentRefs:
  - name: main-gateway
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - "openzaak.dmn-poc.publicground.nl"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: openzaak
      port: 80
