apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openzaak-pg-cluster
  namespace: publicground
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgis:18-3.6-system-trixie"
  storage:
    size: "10Gi"
  bootstrap:
    initdb:
      database: "openzaak"
      owner: "openzaak"
      postInitSQL:
        # PostGIS extensions created at init as superuser.
        # openzaak role must retain superuser so Django's PostGIS backend can run
        # CREATE EXTENSION IF NOT EXISTS postgis during migrate.
        - "CREATE EXTENSION IF NOT EXISTS postgis;"
        - "CREATE EXTENSION IF NOT EXISTS postgis_topology;"
