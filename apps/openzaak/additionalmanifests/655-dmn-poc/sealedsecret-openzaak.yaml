# Sealed with kubeseal against the 655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
# SECRET_KEY: random 50-char alphanumeric
# DJANGO_SUPERUSER_PASSWORD: admin superuser password
# OZ_APP_GZAC_SECRET: shared secret between openzaak and gzac
#
# TODO: The following secrets must be added to the openzaak-config-secrets SealedSecret below:
#   opennotificaties_api_secret: shared secret for Open Zaak to authenticate to Open Notificaties
#   opennotificaties_to_openzaak_secret: shared secret for Open Notificaties authenticating to Open Zaak
#   openzaak_to_opennotificaties_secret: shared secret for Open Zaak authenticating to Open Notificaties
# Run: kubeseal --controller-namespace sealed-secrets --controller-name sealed-secrets \
#       --format yaml < secret.yaml  (then merge encryptedData into the openzaak-config-secrets section below)
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openzaak
  namespace: publicground
spec:
  encryptedData:
    DJANGO_SUPERUSER_PASSWORD: 
    SECRET_KEY: 
  template:
    metadata:
      name: openzaak
      namespace: publicground
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openzaak-config-secrets
  namespace: publicground
spec:
  encryptedData:
    OZ_APP_GZAC_SECRET: 
  template:
    metadata:
      name: openzaak-config-secrets
      namespace: publicground
    type: Opaque
