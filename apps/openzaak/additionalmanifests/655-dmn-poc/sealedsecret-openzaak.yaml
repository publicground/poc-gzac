# Sealed with kubeseal against the 655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
# SECRET_KEY: random 50-char alphanumeric
# DJANGO_SUPERUSER_PASSWORD: admin superuser password
# OZ_APP_GZAC_SECRET: shared secret between openzaak and gzac
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openzaak
  namespace: publicground
spec:
  encryptedData:
    DJANGO_SUPERUSER_PASSWORD: 
    SECRET_KEY: 
  template:
    metadata:
      name: openzaak
      namespace: publicground
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openzaak-config-secrets
  namespace: publicground
spec:
  encryptedData:
    OZ_APP_GZAC_SECRET: 
    opennotificaties_api_secret: 
    opennotificaties_to_openzaak_secret: 
    openzaak_to_opennotificaties_secret: 
  template:
    metadata:
      name: openzaak-config-secrets
      namespace: publicground
    type: Opaque
