apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openzaak-pg-cluster
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgis:18-3.6-system-trixie"
  storage:
    size: "10Gi"
  bootstrap:
    initdb:
      database: "openzaak"
      owner: "openzaak"
      # secretName: "openzaak-pg-app"
      postInitSQL:
        - "CREATE EXTENSION IF NOT EXISTS postgis;"
        - "CREATE EXTENSION IF NOT EXISTS postgis_topology;"
        - "ALTER ROLE openzaak WITH SUPERUSER;"
