apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openzaak
  namespace: publicground
spec:
  parentRefs:
  - name: gateway-local
    namespace: envoy-gateway-system
    sectionName: https
  hostnames:
  - "openzaak.wigo4it.nl"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: openzaak-nginx
      port: 80