apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: openobjecten-pg-cluster
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgis:18-3.6-system-trixie"
  storage:
    size: "10Gi"
  bootstrap:
    initdb:
      database: "openobjecten"
      owner: "openobjecten"
      postInitSQL:
        - "CREATE EXTENSION IF NOT EXISTS postgis;"
        - "CREATE EXTENSION IF NOT EXISTS postgis_topology;"
        - "ALTER ROLE openobjecten WITH SUPERUSER;"
