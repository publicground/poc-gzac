# Sealed with kubeseal against the aks-655-dmn-poc cluster (sealed-secrets ns, controller: sealed-secrets).
# KEYCLOAK_CLIENT_SECRET: Keycloak OIDC client secret for the openobjecten client
#
# To generate and seal:
#   SECRET=$(openssl rand -base64 32)
#   echo -n "$SECRET" | kubeseal --raw --from-file=/dev/stdin \
#     --namespace publicground \
#     --name openobjecten-config-secrets \
#     --context aks-655-dmn-poc \
#     --controller-namespace sealed-secrets \
#     --controller-name sealed-secrets
#
# Note: use the same $SECRET value as OPENOBJECTEN_APP_CLIENT_SECRET in
#       apps/keycloak/overlays/655-dmn-poc/keycloak-realm-secrets-sealed.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: openobjecten-config-secrets
  namespace: publicground
spec:
  encryptedData:
    KEYCLOAK_CLIENT_SECRET: 
  template:
    metadata:
      name: openobjecten-config-secrets
      namespace: publicground
    type: Opaque
