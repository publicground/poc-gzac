    oidc_db_config_enable: true
    oidc_db_config_admin_auth:
      providers:
      - identifier: keycloak-provider
        oidc_use_nonce: true
        oidc_nonce_size: 32
        oidc_state_size: 32
        endpoint_config:
          oidc_op_discovery_endpoint: http://keycloak.wigo4it.nl/realms/publicground/
      items:
      - identifier: admin-oidc
        enabled: true
        oidc_rp_client_id: openobjecten
        oidc_rp_client_secret:
          value_from:
            env: KEYCLOAK_CLIENT_SECRET
        oidc_rp_scopes_list:
        - openid
        - email
        - profile
        oidc_rp_sign_algo: RS256
        oidc_provider_identifier: keycloak-provider
        userinfo_claims_source: id_token
        options:
          user_settings:
            claim_mappings:
              username:
                - sub
              first_name:
                - given_name
              email:
                - email
            username_case_sensitive: true
          groups_settings:
            claim_mapping:
              - roles
            sync: true
            sync_pattern: '*'
            default_groups: []
            make_users_staff: true
            superuser_group_names:
              - OPENOBJECTEN_ADMIN

tags:
  redis: false

replicaCount: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

persistence:
  enabled: false

existingSecret: openobjecten
existingConfigurationSecrets: openobjecten-config-secrets

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openobjecten-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "localhost, openobjecten, openobjecten.wigo4it.nl"

  disable2fa: true

  database:
    host: "openobjecten-pg-cluster-rw"
    port: 5432
    username: "openobjecten"
    name: "openobjecten"

  siteDomain: "openobjecten.wigo4it.nl"

  cache:
    default: "openobjecten-redis:6379/0"
    axes: "openobjecten-redis:6379/1"

  celery:
    brokerUrl: "redis://openobjecten-redis:6379/1"
    resultBackend: "redis://openobjecten-redis:6379/1"
    resultBackendl: "redis://openobjecten-redis:6379/1"

  isHttps: false

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false
