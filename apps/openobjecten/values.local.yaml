global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    password: ""
    email: "peterdummy@wigo4it.nl"
  initContainer:
    enabled: false
  job:
    enabled: false

tags:
  redis: false

replicaCount: 1

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

persistence:
  enabled: false

existingSecret: openobjecten

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openobjecten-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "localhost, openobjecten, openobjecten.wigo4it.nl"

  disable2fa: true

  database:
    host: "openobjecten-pg-cluster-rw"
    port: 5432
    username: "openobjecten"
    name: "openobjecten"

  siteDomain: "openobjecten.wigo4it.nl"

  cache:
    default: "openobjecten-redis:6379/0"
    axes: "openobjecten-redis:6379/1"

  celery:
    brokerUrl: "redis://openobjecten-redis:6379/1"
    resultBackend: "redis://openobjecten-redis:6379/1"
    resultBackendl: "redis://openobjecten-redis:6379/1"

  isHttps: false

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false
