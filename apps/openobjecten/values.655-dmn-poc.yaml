image:
  repository: acr655.azurecr.io/docker.io/maykinmedia/objects-api

global:
  configuration:
    enabled: true
    overwrite: true
    secrets: {}

configuration:
  enabled: true
  overwrite: true
  superuser:
    username: "admin"
    email: "horstp@wigo4it.nl"
    # password field is ignored when existingSecret is set — OBJECTS_SUPERUSER_PASSWORD must be
    # present as a key in the openobjecten SealedSecret (additionalmanifests/655-dmn-poc/sealedsecret-openobjecten.yaml)
  initContainer:
    enabled: false
  job:
    enabled: false

tags:
  redis: false

replicaCount: 1

ingress:
  enabled: false  # Traffic enters via Gateway API HTTPRoute — see additionalmanifests/655-dmn-poc/httproute.yaml

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "1024Mi"
    cpu: "250m"

persistence:
  enabled: false

existingSecret: openobjecten

extraEnvVars:
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: "openobjecten-pg-cluster-app"
        key: "password"

settings:
  allowedHosts: "openobjecten.dmn-poc.publicground.nl"

  disable2fa: false

  database:
    host: "openobjecten-pg-cluster-rw"
    port: 5432
    username: "openobjecten"
    name: "openobjecten"

  siteDomain: "openobjecten.dmn-poc.publicground.nl"

  cache:
    default: "openobjecten-redis:6379/0"
    axes: "openobjecten-redis:6379/1"

  celery:
    brokerUrl: "redis://openobjecten-redis:6379/1"
    resultBackend: "redis://openobjecten-redis:6379/1"
    resultBackendl: "redis://openobjecten-redis:6379/1"

  isHttps: true

worker:
  replicaCount: 1
  livenessProbe:
    enabled: true

redis:
  enabled: false
