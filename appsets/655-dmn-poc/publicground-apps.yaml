# Project for Platform Services
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: publicground-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Publicground Apps
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"


# ApplicationSet for Helm-based services
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: publicground-apps-helm
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/publicground/poc-gzac.git
        revision: refs/heads/main
        requeueAfterSeconds: 180
        files:
          - path: "apps/**/.argocd.yaml"
      selector:
        matchLabels:
          clusters.655-dmn-poc.enabled: 'true'
  template:
    metadata:
      name: "{{.path.basename}}"
    spec:
      project: publicground-apps
      sources:
        - chart: "{{.chartName}}"
          repoURL: "{{.chartRepoURL}}"
          targetRevision: '{{index .clusters "655-dmn-poc" "chartVersion"}}'
          helm:
            valueFiles:
              - $argoRepo/{{ .path.path }}/values.yaml
              - $argoRepo/{{ .path.path }}/values.655-dmn-poc.yaml
        - repoURL: https://github.com/publicground/poc-gzac.git
          targetRevision: refs/heads/main
          ref: argoRepo
          path: '{{ dig "clusters" "655-dmn-poc" "additionalManifests" "" . }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.targetNamespace}}"
      syncPolicy:
        automated:
          allowEmpty: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: "5s"
            factor: 2
            maxDuration: "3m0s"
  # templatePatch renders as raw text before YAML parsing, so Go-template control flow (if/end) is valid here.
  # NB: an empty "spec:" key in the patch clears the existing spec, so only emit it when there's content to add.
  templatePatch: |
    {{- $clusterIgnore := dig "clusters" "655-dmn-poc" "ignoreDifferences" "" . }}
    {{- if $clusterIgnore }}
    spec:
      ignoreDifferences:
        {{- $clusterIgnore | toYaml | nindent 8 }}
    {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: publicground-apps-kustomize
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: https://github.com/publicground/poc-gzac.git
      revision: refs/heads/main
      requeueAfterSeconds: 180
      directories:
      - path: apps/*/overlays/655-dmn-poc
  template:
    metadata:
      name: '{{index .path.segments 1}}'
    spec:
      project: publicground-apps
      sources:
        - repoURL: https://github.com/publicground/poc-gzac.git
          targetRevision: refs/heads/main
          path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          allowEmpty: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 3
          backoff:
            duration: "5s"
            factor: 2
            maxDuration: "3m0s"
