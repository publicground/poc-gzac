version: '3'

vars:
  KIND_VERSION: 1.32.0
  KIND_CLUSTER_NAME: gitops-argocd
  ARGO_CHART_VERSION: 9.4.17
  ARGO_NS: argocd

tasks:
  default:
    desc: "Help / Show available tasks."
    cmds:
      - task --list-all
    silent: true

  requirements-check:
    desc: "Check whether the user has all the required tools installed locally."
    preconditions:
      - sh: command -v kind
        msg: |
          🚨 kind is not installed! Use 'asdf' to install it (see README for details)
      - sh: command -v argocd
        msg: |
          🚨 argocd (cli) is not installed! Use 'asdf' to install it (see README for details)
      - sh: command -v helm
        msg: |
          🚨 helm is not installed! Use 'asdf' to install it (see README for details)
      - sh: command -v kubectl
        msg: |
          🚨 kubectl is not installed! Use 'asdf' to install it (see README for details)
    cmds:
      - echo -e "\n✅  All preconditions have been met.\n"
    silent: true


  run-local:
    desc: "Run a local K8S cluster with all platform-services installed on it."
    deps: [requirements-check]
    cmds:
      - task: create-k8s-cluster
      - task: bootstrap-argocd
      - task: fetch-argocd-creds
      - task: onboard-platform-services

  create-k8s-cluster:
    desc: "Create and start a local Kubernetes cluster with Kind."
    internal: true
    cmds: 
      - |
        LOCAL_DIR="$(pwd)"
        kind create cluster --config=- <<EOF
        kind: Cluster
        apiVersion: kind.x-k8s.io/v1alpha4
        name: {{.KIND_CLUSTER_NAME}}
        nodes:
          - role: control-plane
            image: kindest/node:v{{.KIND_VERSION}}
            extraMounts:
              - hostPath: ${LOCAL_DIR}
                containerPath: /mnt/poc-gzac.git
          - role: worker
            image: kindest/node:v{{.KIND_VERSION}}
            extraMounts:
              - hostPath: ${LOCAL_DIR}
                containerPath: /mnt/poc-gzac.git
          - role: worker
            image: kindest/node:v{{.KIND_VERSION}}
            extraMounts:
              - hostPath: ${LOCAL_DIR}
                containerPath: /mnt/poc-gzac.git
        EOF
    silent: true

  bootstrap-argocd:
    desc: "Bootstrap Argo-CD."
    internal: true
    cmds:
      - echo -e "\n\n🛠️  Bootstrapping Argo-CD  - this can take while!"
      - helm repo add argo https://argoproj.github.io/argo-helm > /dev/null
      - helm repo update > /dev/null
      - |
        helm -n argocd upgrade -f test/local/argocd/values.yaml --install --wait --wait-for-jobs --create-namespace {{.ARGO_NS}} argo/argo-cd --version {{.ARGO_CHART_VERSION}} > /dev/null
    silent: true

  fetch-argocd-creds:
    desc: "Fetch the Argo-CD admin credentials."
    internal: true
    cmds:
      # - echo "⏰  Waiting until Argo-CD credentials are available..."
      # - until kubectl -n {{.ARGO_NS}} get secret argocd-initial-admin-secret>/dev/null; do [ $? -eq 1 ] && sleep 1; done
      # - echo -e "\n👇 ARGO-CD LOGIN CREDENTIALS 👇"
      # - 'echo "Username: admin"'
      # - 'echo "Password: $(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath={.data.password} | base64 -d)"'
      # not needed anymore
      - echo -e "\nExecute a port-forward 'kubectl port-forward service/argocd-server -n argocd 8080:443' and then open the browser on http://localhost:8080 and accept the certificate."
    silent: true

  onboard-platform-services:
    desc: "Onboard all platform-services in Argo-CD."
    cmds:
      - echo -e "\n\n🚀  Onboarding publicground-services in Argo-CD"
      - kubectl -n {{.ARGO_NS}} apply -f test/local/cluster/root.yaml
    silent: true

  uninstall:
    desc: "Uninstall local set-up"
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER_NAME}}
    silent: true

  validate:
    desc: "Run local validations (YAML syntax + kubeconform) for ArgoCD repo"
    cmds:
      - bash scripts/validate.sh
    silent: true

  expose-lb:
    desc: "Expose Services of type LoadBalancer locally (cloud-provider-kind)"
    preconditions:
      - sh: command -v cloud-provider-kind
        msg: |
          🚨 cloud-provider-kind is not installed!
          Install instructions: https://github.com/kubernetes-sigs/cloud-provider-kind?tab=readme-ov-file#install
          Once installed, rerun: task expose-lb
    cmds:
      - echo "🛠️  Starting cloud-provider-kind (requires sudo to provision veth interfaces)"
      - sudo cloud-provider-kind
    silent: true