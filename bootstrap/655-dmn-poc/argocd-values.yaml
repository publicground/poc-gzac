# ArgoCD zelf blijft een bootstrap-Helm-release (buiten GitOps). Bijwerken met:
#   helm --kube-context aks-655-dmn-poc -n argocd upgrade argocd argo/argo-cd --version 9.4.17 -f bootstrap/655-dmn-poc/argocd-values.yaml
configs:
  cm:
    # Nodig voor helmCharts in kustomize-overlays (o.a. openzaak, envoy-gateway)
    kustomize.buildOptions: "--enable-helm --load-restrictor LoadRestrictionsNone"
  params:
    server.insecure: true
  rbac:
    policy.csv: |
      p, role:admin, applications, *, */*, allow
      p, role:admin, clusters, *, *, allow
      p, role:admin, repositories, *, *, allow
      p, role:admin, projects, *, *, allow
    policy.default: role:readonly

controller:
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

applicationSet:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

repoServer:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

server:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

dex:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi

notifications:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi

redis:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 64Mi

extraObjects:
  - apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: argocd
      namespace: argocd
    spec:
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: main-gateway
          namespace: envoy-gateway-system
          sectionName: https
      hostnames:
        - argocd.dmn-poc.publicground.nl
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          backendRefs:
            - group: ""
              kind: Service
              name: argocd-server
              port: 80
              weight: 1
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: default-deny-all
      namespace: argocd
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
        - Egress
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-argocd
      namespace: argocd
    spec:
      podSelector: {}
      policyTypes:
        - Ingress
        - Egress
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: envoy-gateway-system
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: argocd
      egress:
        - {}
